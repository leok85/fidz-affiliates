name: CI

# Roda em todo PR para a main e em todo push na main. O plano do GitHub não bloqueia o merge com
# check vermelho: só mergear com o CI verde é regra de disciplina.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O build só precisa que as variáveis existam; nenhuma chamada ao Supabase acontece aqui.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:56321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  secrets:
    name: Segredos no código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks sobre os commits do PR (ou do push). A varredura de segredos do GitHub é paga em
      # repositório privado; esta roda de graça.
      - name: gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="HEAD~1..HEAD"
          fi
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --log-opts="$range"

